name: Earnings poster

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils || echo "OCR deps install failed; OCR fallback will skip"
      - run: pip install -r requirements.txt
      - run: python watcher.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save state
        run: |
          git config user.name "earnings-poster"
          git config user.email "earnings-poster@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "update seen filings"
          git push
