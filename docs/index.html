<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Share Market Charts — Results Archive</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2em auto; max-width: 1100px; padding: 0 1em; color: #111; }
  h1 { font-size: 1.4em; }
  p.note { color: #555; }
  input { width: 100%; padding: 0.6em; margin: 1em 0; font-size: 1em; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border-bottom: 1px solid #ddd; padding: 0.45em 0.6em; text-align: left; font-size: 0.92em; }
  th { background: #0f2a4a; color: #fff; }
  tr:nth-child(even) td { background: #f6f8fb; }
  a { color: #0b5cab; }
</style>
</head>
<body>
<h1>Share Market Charts — Results Archive</h1>
<p class="note">Every results post sent to the channel, newest first. Numbers are
as posted from the official filings. For education only — not investment
advice. I am not SEBI-registered.</p>
<input id="q" type="search" placeholder="Search company or ticker…">
<p id="status">Loading archive…</p>
<table id="tbl" hidden>
  <thead><tr>
    <th>Date</th><th>Company</th><th>Rating</th><th>Basis</th><th>Quarter</th>
    <th>Sales (Cr)</th><th>PAT (Cr)</th><th>EPS</th><th>Links</th>
  </tr></thead>
  <tbody id="rows"></tbody>
</table>
<script>
const STATE_URL = "https://raw.githubusercontent.com/Arka2232/earnings-poster/main/state.json";
function num(v) {
  return (v === null || v === undefined) ? "–"
    : Number(v).toLocaleString("en-IN", {maximumFractionDigits: 2});
}
function cell(text) {
  const td = document.createElement("td");
  td.textContent = text;
  return td;
}
let entries = [];
function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const tbody = document.getElementById("rows");
  tbody.innerHTML = "";
  const shown = entries.filter(e =>
    !q || (e.s || "").toLowerCase().includes(q) ||
    (e.c || "").toLowerCase().includes(q));
  for (const e of shown) {
    const tr = document.createElement("tr");
    tr.appendChild(cell(e.d || ""));
    const comp = document.createElement("td");
    comp.textContent = e.c ? e.c + " (" + e.s + ")" : (e.s || "");
    tr.appendChild(comp);
    tr.appendChild(cell(e.r || ""));
    tr.appendChild(cell(e.b || ""));
    tr.appendChild(cell(e.q || ""));
    tr.appendChild(cell(num(e.sales)));
    tr.appendChild(cell(num(e.pat)));
    tr.appendChild(cell(num(e.eps)));
    const links = document.createElement("td");
    if (e.filing) {
      const a = document.createElement("a");
      a.href = e.filing; a.target = "_blank"; a.rel = "noopener";
      a.textContent = "Result ↗"; links.appendChild(a);
    }
    if (e.chart) {
      if (e.filing) links.appendChild(document.createTextNode(" · "));
      const a = document.createElement("a");
      a.href = e.chart; a.target = "_blank"; a.rel = "noopener";
      a.textContent = "Chart ↗"; links.appendChild(a);
    }
    if (!e.filing && !e.chart) links.textContent = "–";
    tr.appendChild(links);
    tbody.appendChild(tr);
  }
  document.getElementById("status").textContent =
    shown.length + " posts" + (q ? " matching your search" : "") + ".";
}
fetch(STATE_URL)
  .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(state => {
    entries = (state.archive || []).slice().reverse();
    document.getElementById("tbl").hidden = false;
    render();
  })
  .catch(err => {
    document.getElementById("status").textContent =
      "Archive could not be loaded (" + err.message + "). Please try again later.";
  });
document.getElementById("q").addEventListener("input", render);
</script>
</body>
</html>
